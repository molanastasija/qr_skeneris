<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Darbu saņemšana — QR skeneris</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --ink: #1c2430; --muted: #6b7686; --line: #dde3ea;
    --brand: #1f3a5f; --ok: #1e7b3c; --ok-bg: #e3f4e8; --warn: #9a5b00; --warn-bg: #fff2d9;
    --err: #a3201d; --err-bg: #fde4e3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { background: var(--brand); color: #fff; padding: 14px 16px calc(14px) ;
           padding-top: calc(14px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 600; }
  header button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px;
                  padding: 6px 10px; font-size: 14px; }
  main { max-width: 520px; margin: 0 auto; padding: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px;
          box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 60px; }
  #reader video { border-radius: 12px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button.main { background: var(--brand); color: #fff; border: 0; border-radius: 10px;
                padding: 13px; font-size: 16px; font-weight: 600; width: 100%; }
  button.sec { background: #fff; color: var(--brand); border: 1.5px solid var(--brand);
               border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 600; width: 100%; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid var(--line);
          border-radius: 10px; background: #fff; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  #result { display: none; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  #result.ok   { display: block; background: var(--ok-bg);   color: var(--ok);   }
  #result.warn { display: block; background: var(--warn-bg); color: var(--warn); }
  #result.err  { display: block; background: var(--err-bg);  color: var(--err);  }
  #result .t { font-weight: 700; font-size: 18px; }
  #result .d { color: var(--ink); margin-top: 6px; font-size: 15px; }
  #result .c { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .stats { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .stats b { color: var(--ink); }
  ul#log { list-style: none; margin: 0; padding: 0; }
  ul#log li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; display: flex; gap: 8px; }
  ul#log li:first-child { border-top: 0; }
  ul#log .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; }
  .s-saved .dot { background: var(--ok); } .s-duplicate .dot { background: #e0a100; }
  .s-error .dot, .s-invalid .dot { background: var(--err); } .s-queued .dot { background: #8a96a8; }
  ul#log small { color: var(--muted); display: block; }
  .hidden { display: none !important; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Darbu saņemšana<span id="who" style="display:block;font-size:12px;font-weight:400;opacity:.8"></span></h1>
  <button id="btnSettings" type="button">Iestatījumi</button>
</header>

<main>
  <!-- Iestatījumi (pirmā palaišana) -->
  <section id="settings" class="card hidden">
    <h2>Iestatījumi</h2>
    <label for="inUrl">Tīmekļa lietotnes adrese (…/exec)</label>
    <input id="inUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label for="inPin">Jūsu personīgais PIN</label>
    <input id="inPin" type="password" inputmode="numeric" autocomplete="off">
    <div style="height:12px"></div>
    <button class="main" id="btnSave" type="button">Saglabāt un pārbaudīt savienojumu</button>
    <div class="hint" id="settingsMsg"></div>
  </section>

  <section id="app">
    <div id="result"></div>

    <div class="card">
      <div id="reader"></div>
      <div style="height:10px"></div>
      <button class="main" id="btnCam" type="button">Sākt skenēšanu</button>
      <div style="height:8px"></div>
      <div class="row">
        <button class="sec" id="btnPhoto" type="button">Skenēt no foto</button>
      </div>
      <input id="fileIn" type="file" accept="image/*" capture="environment" class="hidden">
    </div>

    <div class="card">
      <h2>Ievadīt manuāli</h2>
      <div class="row">
        <input id="manual" type="text" placeholder="30193909 MDTEK03" autocomplete="off" autocapitalize="characters">
        <button class="sec" id="btnManual" type="button" style="flex:0 0 90px">Pievienot</button>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <span>Šajā sesijā saglabāti: <b id="cntSaved">0</b></span>
        <span>Gaida nosūtīšanu: <b id="cntQueue">0</b></span>
      </div>
    </div>

    <div class="card">
      <h2>Pēdējie skenējumi</h2>
      <ul id="log"><li><small>Vēl nav skenējumu</small></li></ul>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  // ======= Ja vēlaties, adresi var ierakstīt šeit, lai tā nebūtu jāievada telefonā =======
  var DEFAULT_URL = '';

  var QR_RE = /^\s*(\d{4,12})\s+([A-Za-z0-9]{2,20})\s*$/;
  var COOLDOWN_MS = 4000;     // to pašu kodu atkārtoti neapstrādā 4 sekundes
  var LS = { url: 'qr_url', pin: 'qr_pin', user: 'qr_user', queue: 'qr_queue' };

  var $ = function (id) { return document.getElementById(id); };
  var scanner = null, scanning = false, busy = false;
  var lastText = '', lastTime = 0, savedCount = 0;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function cfg() { return { url: read(LS.url) || DEFAULT_URL, pin: read(LS.pin) }; }
  function showUser(name) { $('who').textContent = name ? 'Lietotājs: ' + name : ''; }

  function getQueue() { try { return JSON.parse(read(LS.queue) || '[]'); } catch (e) { return []; } }
  function setQueue(q) { store(LS.queue, JSON.stringify(q)); $('cntQueue').textContent = q.length; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- Atgriezeniskā saite ----------
  function feedback(kind) {
    try {
      if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 80 : [60, 60, 60]);
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      feedback.ctx = feedback.ctx || new Ctx();
      var ctx = feedback.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = kind === 'ok' ? 1046 : 330;
      g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + (kind === 'ok' ? 0.12 : 0.3));
    } catch (e) {}
  }

  function showResult(cls, title, detail, code) {
    var r = $('result');
    r.className = cls;
    r.innerHTML = '<div class="t">' + esc(title) + '</div>' +
      (detail ? '<div class="d">' + esc(detail) + '</div>' : '') +
      (code ? '<div class="c">' + esc(code) + '</div>' : '');
  }

  var logItems = [];
  function addLog(status, main, sub) {
    logItems.unshift({ status: status, main: main, sub: sub,
      time: new Date().toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit' }) });
    logItems = logItems.slice(0, 15);
    $('log').innerHTML = logItems.map(function (it) {
      return '<li class="s-' + it.status + '"><span class="dot"></span><span>' + esc(it.main) +
        '<small>' + esc(it.time + (it.sub ? ' · ' + it.sub : '')) + '</small></span></li>';
    }).join('');
  }

  // ---------- Saziņa ar Google tabulu ----------
  function post(payload) {
    var c = cfg();
    payload.pin = c.pin;
    // text/plain → bez CORS preflight pieprasījuma, Apps Script to pieņem
    return fetch(c.url, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function handleText(text, source) {
    text = String(text || '').trim();
    var now = Date.now();
    if (source === 'camera' && text === lastText && now - lastTime < COOLDOWN_MS) return;
    lastText = text; lastTime = now;

    var m = text.match(QR_RE);
    if (!m) {
      feedback('err');
      showResult('err', 'Nederīgs QR kods', 'Gaidīts: iestādes kods un pārbaudījuma kods', text);
      addLog('invalid', 'Nederīgs: ' + text, '');
      return;
    }
    var item = { qr: m[1] + ' ' + m[2].toUpperCase(), source: source,
                 scannedAt: new Date().toISOString() };
    send(item, true);
  }

  function send(item, interactive) {
    if (interactive) showResult('warn', 'Sūta…', '', item.qr);
    return post({ action: 'scan', qr: item.qr, source: item.source, scannedAt: item.scannedAt })
      .then(function (res) {
        if (res.status === 'busy') throw new Error('busy');   // tabula aizņemta → rindā
        if (!interactive) return res;
        var who = [res.schoolName || ('Iestāde ' + (res.schoolCode || '')), res.examName || res.examCode]
          .filter(Boolean).join(' — ');
        if (res.status === 'saved') {
          savedCount++; $('cntSaved').textContent = savedCount;
          feedback('ok');
          showResult('ok', '✓ ' + res.message, who, item.qr);
          addLog('saved', res.schoolName || res.schoolCode, res.examCode);
        } else if (res.status === 'duplicate') {
          feedback('err');
          showResult('warn', '⚠ Šis darbs jau ir reģistrēts', who + '. ' + res.message, item.qr);
          addLog('duplicate', (res.schoolName || res.schoolCode) + ' (atkārtots)', res.examCode);
        } else if (res.status === 'auth') {
          feedback('err');
          showResult('err', 'Nepareizs PIN', 'PIN nav derīgs vai lietotājs ir atslēgts. Ievadiet savu PIN.', '');
          addLog('error', item.qr, 'nav saglabāts — PIN');
          openSettings();
        } else {
          feedback('err');
          showResult('err', 'Kļūda', res.message || '', item.qr);
          addLog('error', item.qr, res.message || '');
        }
        return res;
      })
      .catch(function () {
        if (!interactive) throw new Error('offline');
        var q = getQueue(); q.push(item); setQueue(q);
        feedback('ok');
        showResult('warn', 'Nav savienojuma vai tabula aizņemta — saglabāts rindā',
          'Tiks nosūtīts automātiski, kad būs internets', item.qr);
        addLog('queued', item.qr, 'gaida nosūtīšanu');
      });
  }

  var flushing = false;
  function flushQueue() {
    var q = getQueue();
    if (!q.length || flushing || !cfg().url) return;
    flushing = true;
    var item = q[0];
    send(item, false).then(function (res) {
      if (res && res.status === 'auth') { flushing = false; return; }   // nepareizs PIN — paturam rindā
      var rest = getQueue().slice(1); setQueue(rest);
      if (res && res.status === 'saved') { savedCount++; $('cntSaved').textContent = savedCount; }
      addLog(res && res.status === 'saved' ? 'saved' : (res && res.status) || 'error',
        (res && (res.schoolName || res.schoolCode)) || item.qr, 'no rindas · ' + ((res && res.message) || ''));
      flushing = false;
      if (rest.length) flushQueue();
    }).catch(function () { flushing = false; });
  }
  setInterval(flushQueue, 15000);
  window.addEventListener('online', flushQueue);

  // ---------- Kamera ----------
  function startCamera() {
    if (!window.Html5Qrcode) { showResult('err', 'Neizdevās ielādēt skenera bibliotēku', 'Pārbaudiet internetu', ''); return; }
    scanner = scanner || new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] });
    scanner.start({ facingMode: 'environment' },
      { fps: 10, qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      function (text) {
        if (busy) return;
        busy = true;
        handleText(text, 'camera');
        setTimeout(function () { busy = false; }, 1500);
      },
      function () {})
      .then(function () { scanning = true; $('btnCam').textContent = 'Apturēt skenēšanu'; })
      .catch(function (err) {
        showResult('err', 'Kamera nav pieejama',
          'Atļaujiet kameras piekļuvi pārlūkā vai izmantojiet «Skenēt no foto». ' + (err && err.message ? err.message : err), '');
      });
  }
  function stopCamera() {
    if (!scanner || !scanning) return;
    scanner.stop().then(function () { scanning = false; $('btnCam').textContent = 'Sākt skenēšanu'; });
  }

  $('btnCam').onclick = function () {
    if (!cfg().url) { openSettings(); return; }
    scanning ? stopCamera() : startCamera();
  };

  $('btnPhoto').onclick = function () {
    if (!cfg().url) { openSettings(); return; }
    $('fileIn').click();
  };
  $('fileIn').onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var wasScanning = scanning;
    var go = function () {
      var tmp = new Html5Qrcode('reader');
      tmp.scanFile(f, false)
        .then(function (text) { handleText(text, 'photo'); })
        .catch(function () { feedback('err'); showResult('err', 'QR kods foto netika atrasts', 'Mēģiniet vēlreiz tuvāk un asāk', ''); })
        .then(function () { try { tmp.clear(); } catch (x) {} e.target.value = ''; if (wasScanning) startCamera(); });
    };
    if (scanning) scanner.stop().then(function () { scanning = false; $('btnCam').textContent = 'Sākt skenēšanu'; go(); });
    else go();
  };

  $('btnManual').onclick = function () {
    if (!cfg().url) { openSettings(); return; }
    var v = $('manual').value;
    if (!v.trim()) return;
    handleText(v, 'manual');
    $('manual').value = '';
  };
  $('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnManual').click(); });

  // ---------- Iestatījumi ----------
  function openSettings() {
    var c = cfg();
    $('inUrl').value = c.url; $('inPin').value = c.pin;
    $('settings').classList.remove('hidden');
    $('settingsMsg').textContent = '';
    window.scrollTo(0, 0);
  }
  $('btnSettings').onclick = function () {
    $('settings').classList.contains('hidden') ? openSettings() : $('settings').classList.add('hidden');
  };
  $('btnSave').onclick = function () {
    var url = $('inUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      $('settingsMsg').textContent = 'Adresei jābeidzas ar /exec un jāsākas ar https://script.google.com/';
      return;
    }
    store(LS.url, url); store(LS.pin, $('inPin').value.trim());
    $('settingsMsg').textContent = 'Pārbauda…';
    post({ action: 'ping' }).then(function (res) {
      if (res.ok) {
        store(LS.user, res.user || ''); showUser(res.user);
        $('settingsMsg').textContent = '✓ Savienojums darbojas. Lietotājs: ' + (res.user || '');
        setTimeout(function () { $('settings').classList.add('hidden'); }, 800);
        flushQueue();
      } else {
        store(LS.user, ''); showUser('');
        $('settingsMsg').textContent = res.status === 'auth' ? 'Nepareizs vai neaktīvs PIN' : (res.message || 'Kļūda');
      }
    }).catch(function () {
      $('settingsMsg').textContent = 'Neizdevās sazināties. Pārbaudiet adresi un to, vai izvietojumam ir piekļuve «Visi».';
    });
  };

  // URL parametri ātrai kolēģu iestatīšanai: index.html?url=…/exec
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('url')) store(LS.url, p.get('url'));
  } catch (e) {}

  setQueue(getQueue());
  showUser(read(LS.user));
  if (!cfg().url || !cfg().pin) openSettings();
  flushQueue();
})();
</script>
</body>
</html>
